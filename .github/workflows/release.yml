# The maintainer mirrors Gitea's verified assets to GitHub, then dispatches this
# workflow on the release tag to update the SDK index. No package is rebuilt here.
name: release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  index:
    # GitHub Packages has no Python registry, so the SDK index is a static PEP 503 page
    # on GitHub Pages whose links point at the wheels in the releases. It is rebuilt from
    # every formal release, so earlier versions stay installable. Pages must be set to
    # deploy from GitHub Actions in the repository settings.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}simple/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Published formal release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -I tools/check_tag.py --github --tag "$GITHUB_REF_NAME" --commit "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/master
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease --jq 'if .isDraft or .isPrerelease then error("a public formal release is required") else . end'
      - name: Index of the SDK wheels in all releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          wheels="$RUNNER_TEMP/wheels"
          gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
              --limit 1000 --json tagName --jq '.[].tagName' | grep '^v' | while read -r tag; do
            # Releases from before the SDK wheel was attached are skipped.
            assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            if grep -q '^maestro_sdk-.*\.whl$' <<< "$assets"; then
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
                --pattern 'maestro_sdk-*.whl' --dir "$wheels/$tag"
            fi
          done
          python3 -I tools/package_index.py --wheels "$wheels" --out "$RUNNER_TEMP/site" \
            --base-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - id: deploy
        uses: actions/deploy-pages@v4
