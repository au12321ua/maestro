[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "maestro-sdk"
version = "0.4.0.dev0"
description = "Python client for the Maestro team experiment service"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/maestro_sdk"]

# The repository's agent skills ship inside the wheel (maestro_sdk.skills).
[tool.hatch.build.targets.wheel.force-include]
"../skills" = "maestro_sdk/_skills"
