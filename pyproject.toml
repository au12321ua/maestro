[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "maestro"
version = "0.4.0"
description = "Team experiment service built on Harbor"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23,<26",
    "cryptography>=44,<47",
    "fastapi>=0.115,<1",
    "httpx[socks]>=0.28.1",
    "python-multipart>=0.0.20,<1",
    "rich>=13,<16",
    "sqlalchemy>=2.0.36,<2.1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
maestro = "maestro.cli:main"

[dependency-groups]
dev = [
    "datamodel-code-generator==0.86.0",
    "httpx>=0.28",
    "maestro-sdk",
    "pytest>=8,<10",
    "pytest-xdist>=3.6,<4",
    "ruff>=0.12,<1",
]

[tool.uv.sources]
maestro-sdk = { path = "sdk", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/maestro"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/maestro/db/migrations/versions", "sdk/src/maestro_sdk/models.py"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
