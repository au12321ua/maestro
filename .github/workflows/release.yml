# GitHub only receives master and its v* tags when a release is made, after the same
# version was tested and published on Gitea. So this workflow runs no tests:
# it rebuilds the package from the tag and publishes a GitHub Release with the same
# assets, then rebuilds the SDK package index on GitHub Pages from the wheels of all
# releases. Gitea reads only .gitea/workflows and never runs this file.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Environments for the package and the license list
        # The web pages are built and committed, so npm only provides the license texts.
        run: |
          python -m pip install uv==0.11.31
          uv sync --locked
          (cd runner && uv sync --locked)
          (cd frontend && npm ci --no-audit --no-fund --ignore-scripts)
      - name: Build
        run: |
          # actions/checkout replaces the annotated tag with a plain ref to the commit;
          # fetch the tag object itself before checking that it is annotated.
          git fetch --no-tags --force origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "$GITHUB_REF_NAME is not on master"; exit 1
          fi
          uv run python tools/build_release.py --assets --expect-version "${GITHUB_REF_NAME#v}" --out dist
          python3 -I tools/validate_release.py --dist dist --commit "$(git rev-parse HEAD)" --expect-version "${GITHUB_REF_NAME#v}"
          cp "docs/releases/$GITHUB_REF_NAME.md" "$RUNNER_TEMP/notes.md"
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -I tools/publish_release.py --github --dist dist --tag "$GITHUB_REF_NAME" --commit "$(git rev-parse HEAD)" --notes "$RUNNER_TEMP/notes.md"
  index:
    # GitHub Packages has no Python registry, so the SDK index is a static PEP 503 page
    # on GitHub Pages whose links point at the wheels in the releases. It is rebuilt from
    # every formal release, so earlier versions stay installable. Pages must be set to
    # deploy from GitHub Actions in the repository settings.
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}simple/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Index of the SDK wheels in all releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          wheels="$RUNNER_TEMP/wheels"
          gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
              --limit 1000 --json tagName --jq '.[].tagName' | grep '^v' | while read -r tag; do
            # Releases from before the SDK wheel was attached are skipped.
            assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            if grep -q '^maestro_sdk-.*\.whl$' <<< "$assets"; then
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
                --pattern 'maestro_sdk-*.whl' --dir "$wheels/$tag"
            fi
          done
          python3 -I tools/package_index.py --wheels "$wheels" --out "$RUNNER_TEMP/site" \
            --base-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - id: deploy
        uses: actions/deploy-pages@v4
