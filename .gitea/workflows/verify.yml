# Branch pushes verify source; tags reuse that exact commit's verification.
# Checks for every push: lint, Markdown links, the pytest suite
# without Docker, Hub or model requests (it includes the contract and SDK model drift
# check), third-party licenses and the web build. A push to dev that passes them becomes a
# prerelease, a v* tag on master a release, and the SDK goes to the Gitea Python
# package registry with it; nothing is deployed.
name: verify
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    # Pushes that change only Markdown docs do not run. The SDK skill and
    # guide are checked by tests, so they still count. Tag pushes always run.
    paths: ["**", "!**.md", "skills/**", "sdk/README.md"]
  workflow_dispatch:
# Checks and publishing have independent results. Credentials are scoped to API steps.
permissions:
  contents: read
  actions: read
env:
  # Downloads that hang fail fast and are retried instead of using up the job.
  UV_HTTP_TIMEOUT: "60"
  UV_HTTP_RETRIES: "5"
  npm_config_fetch_timeout: "60000"
  npm_config_fetch_retries: "5"
  # Optional proxy for dependency downloads only (repository variable).
  CI_PROXY: ${{ vars.CI_PROXY }}
jobs:
  verify:
    # Host runners must never execute an external fork's code.
    if: ${{ github.ref_type != 'tag' }}
    runs-on: ${{ vars.HH_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Isolate HOME and caches
        # A host runner may share the machine with real instances: nothing below may read
        # or write their state, credentials or caches.
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
          echo "UV_PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"
          echo "UV_PYTHON_DOWNLOADS=never" >> "$GITHUB_ENV"
          python -m pip install uv==0.11.31
      - name: Service and Runner environments
        timeout-minutes: 15
        run: |
          if [ -n "$CI_PROXY" ]; then export HTTPS_PROXY="$CI_PROXY" HTTP_PROXY="$CI_PROXY"; fi
          for attempt in 1 2 3; do
            uv sync --locked --group dev && (cd runner && uv sync --locked) && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "::warning::dependency download failed, retrying ($attempt)"
          done
      - name: Lint
        run: |
          uv run ruff check src tests runner/src tools sdk/src ops
          uv run ruff format --check src/maestro tests/maestro runner/src tools sdk/src ops
      - name: Markdown links
        run: python tools/check_doc_links.py
      - name: Versions
        run: uv run python tools/version.py
      - name: Tests
        # Only PATH and the isolated HOME pass through, so no inherited credential or
        # MAESTRO_* switch (Docker, Hub, real model) reaches the suite.
        run: env -i PATH="$PATH" HOME="$HOME" UV_PYTHON="$UV_PYTHON" UV_PYTHON_DOWNLOADS=never uv run pytest -q -n 4
      - name: Web client dependencies
        working-directory: frontend
        timeout-minutes: 10
        run: |
          if [ -n "$CI_PROXY" ]; then export HTTPS_PROXY="$CI_PROXY" HTTP_PROXY="$CI_PROXY"; fi
          for attempt in 1 2 3; do
            npm ci --no-audit --no-fund && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "::warning::npm download failed, retrying ($attempt)"
          done
      - name: Web client
        working-directory: frontend
        run: |
          npm run lint
          npm run check:api
          npm run check:i18n
          npm run build
      - name: Built pages match their sources
        run: |
          changed="$(git status --porcelain -- src/maestro/static)"
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "src/maestro/static is out of date: run 'npm run build' in frontend/ and commit it."
            exit 1
          fi
      - name: Third-party licenses are allowed
        run: uv run python tools/third_party_licenses.py
  publish:
    permissions:
      contents: write
      actions: read
    needs: verify
    if: ${{ always() && github.event_name == 'push' && (github.ref_type == 'tag' || (github.ref == 'refs/heads/dev' && needs.verify.result == 'success')) }}
    runs-on: ${{ vars.HH_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verified release commit
        if: ${{ github.ref_type == 'tag' }}
        env:
          GITEA_API: ${{ github.api_url }}
          GITEA_REPO: ${{ github.repository }}
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git merge-base --is-ancestor HEAD origin/master
          python3 -I tools/check_tag.py --tag "$GITHUB_REF_NAME" --commit "$(git rev-parse HEAD)"
          python3 -I tools/verify_commit.py --commit "$(git rev-parse HEAD)"
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Isolate build environment
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
          echo "UV_PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"
          echo "UV_PYTHON_DOWNLOADS=never" >> "$GITHUB_ENV"
          python -m pip install uv==0.11.31
      - name: Build dependencies
        timeout-minutes: 15
        run: |
          if [ -n "$CI_PROXY" ]; then export HTTPS_PROXY="$CI_PROXY" HTTP_PROXY="$CI_PROXY"; fi
          for attempt in 1 2 3; do
            uv sync --locked && (cd runner && uv sync --locked) && (cd frontend && npm ci --no-audit --no-fund --ignore-scripts) && break
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
      - name: Build and validate release assets
        timeout-minutes: 15
        run: |
          if [ -n "$CI_PROXY" ]; then export HTTPS_PROXY="$CI_PROXY" HTTP_PROXY="$CI_PROXY"; fi
          out="$RUNNER_TEMP/release"
          mkdir -p "$out/dist"
          if [ "${{ github.ref_type }}" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            uv run python tools/build_release.py --assets --expect-version "$version" --out "$out/dist"
            python3 -I tools/validate_release.py --dist "$out/dist" --commit "$(git rev-parse HEAD)" --expect-version "$version"
            cp "docs/releases/$GITHUB_REF_NAME.md" "$out/notes.md"
          else
            uv run python tools/build_release.py --assets --dev-number "${{ github.run_number }}" --out "$out/dist"
            python3 -I tools/validate_release.py --dist "$out/dist" --commit "$(git rev-parse HEAD)"
            git log -1 --format='%s (%h)' > "$out/notes.md"
          fi
      - name: Publish the SDK to the package registry
        env:
          GITEA_URL: ${{ github.server_url }}
          GITEA_OWNER: ${{ github.repository_owner }}
          GITEA_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
        run: |
          if [ -z "$GITEA_TOKEN" ]; then
            if [ "${{ github.ref_type }}" = tag ]; then
              echo "PACKAGE_TOKEN is required for a formal release"; exit 1
            fi
            echo "::warning::PACKAGE_TOKEN is missing; SDK preview was not published"
            exit 0
          fi
          if [ "${{ github.ref_type }}" = tag ]; then
            python3 -I tools/publish_package.py --dist "$RUNNER_TEMP/release/dist"
          else
            python3 -I tools/publish_package.py --dist "$RUNNER_TEMP/release/dist" --keep 10
          fi
      - name: Publish Gitea Release
        env:
          GITEA_API: ${{ github.api_url }}
          GITEA_REPO: ${{ github.repository }}
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out="$RUNNER_TEMP/release"
          sha="$(git rev-parse HEAD)"
          if [ "${{ github.ref_type }}" = tag ]; then
            python3 -I tools/publish_release.py --dist "$out/dist" --notes "$out/notes.md" --tag "$GITHUB_REF_NAME" --commit "$sha"
          else
            python3 -I tools/publish_release.py --dist "$out/dist" --notes "$out/notes.md" --tag "dev-${sha:0:12}" --commit "$sha" --prerelease --keep 10
          fi
