# Checks for every push (docs/HANDOFF.md, 验证入口): lint, Markdown links, the pytest suite
# without Docker, Hub or model requests (it includes the contract and SDK model drift
# check), third-party licenses and the web build. A push to dev that passes them becomes a
# prerelease, a v* tag on master a release (N-02); nothing is deployed.
name: verify
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    # Pushes that change only Markdown docs do not run (U-37, U-43). The SDK skill and
    # guide are checked by tests, so they still count. Tag pushes always run.
    paths: ["**", "!**.md", "skills/**", "sdk/README.md"]
  pull_request:
    paths: ["**", "!**.md", "skills/**", "sdk/README.md"]
  workflow_dispatch:
permissions:
  contents: read
env:
  # Downloads that hang fail fast and are retried instead of using up the job (N-24).
  UV_HTTP_TIMEOUT: "60"
  UV_HTTP_RETRIES: "5"
  npm_config_fetch_timeout: "60000"
  npm_config_fetch_retries: "5"
  # Optional proxy for dependency downloads only (repository variable, N-24).
  CI_PROXY: ${{ vars.CI_PROXY }}
jobs:
  verify:
    # Host runners must never execute an external fork's code.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ vars.HH_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # A release checks that its tag is on master and lists the commits since the
          # previous tag, so a tag push fetches all branches and history.
          fetch-depth: ${{ github.ref_type == 'tag' && '0' || '1' }}
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Isolate HOME and caches
        # A host runner may share the machine with real instances: nothing below may read
        # or write their state, credentials or caches.
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
          echo "UV_PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"
          echo "UV_PYTHON_DOWNLOADS=never" >> "$GITHUB_ENV"
          python -m pip install uv==0.13.5
      - name: Service and Runner environments
        timeout-minutes: 15
        run: |
          if [ -n "$CI_PROXY" ]; then export HTTPS_PROXY="$CI_PROXY" HTTP_PROXY="$CI_PROXY"; fi
          for attempt in 1 2 3; do
            uv sync --locked --group dev && (cd runner && uv sync --locked) && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "::warning::dependency download failed, retrying ($attempt)"
          done
      - name: Lint
        run: |
          uv run ruff check src tests runner/src tools sdk/src ops
          uv run ruff format --check src/maestro tests/maestro runner/src tools sdk/src ops
      - name: Markdown links
        run: python tools/check_doc_links.py
      - name: Tests
        # Only PATH and the isolated HOME pass through, so no inherited credential or
        # MAESTRO_* switch (Docker, Hub, real model) reaches the suite.
        run: env -i PATH="$PATH" HOME="$HOME" UV_PYTHON="$UV_PYTHON" UV_PYTHON_DOWNLOADS=never uv run pytest -q -n 4
      - name: Web client dependencies
        working-directory: frontend
        timeout-minutes: 10
        run: |
          if [ -n "$CI_PROXY" ]; then export HTTPS_PROXY="$CI_PROXY" HTTP_PROXY="$CI_PROXY"; fi
          for attempt in 1 2 3; do
            npm ci --no-audit --no-fund && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "::warning::npm download failed, retrying ($attempt)"
          done
      - name: Web client
        working-directory: frontend
        run: |
          npm run lint
          npm run check:api
          npm run build
      - name: Built pages match their sources
        run: |
          changed="$(git status --porcelain -- src/maestro/static)"
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "src/maestro/static is out of date: run 'npm run build' in frontend/ and commit it."
            exit 1
          fi
      - name: Third-party licenses are allowed
        run: uv run python tools/third_party_licenses.py
      - name: Release assets
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref_type == 'tag') }}
        timeout-minutes: 15
        run: |
          if [ -n "$CI_PROXY" ]; then export HTTPS_PROXY="$CI_PROXY" HTTP_PROXY="$CI_PROXY"; fi
          out="$RUNNER_TEMP/release"
          mkdir -p "$out/dist"
          if [ "${{ github.ref_type }}" = tag ]; then
            # A release comes only from a tag on master whose name is the code's version.
            if ! git merge-base --is-ancestor HEAD origin/master; then
              echo "${{ github.ref_name }} is not on master"; exit 1
            fi
            uv run python tools/build_release.py --assets --expect-version "${GITHUB_REF_NAME#v}" --out "$out/dist"
            previous="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)"
            git log --format='- %s (%h)' ${previous:+"$previous..HEAD"} > "$out/notes.md"
          else
            uv run python tools/build_release.py --assets --out "$out/dist"
            git log -1 --format='%s%n%n%b' > "$out/notes.md"
          fi
          cp tools/publish_release.py "$out/"
          ls -l "$out/dist"
      - if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref_type == 'tag') }}
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 7

  release:
    # Only this job can write to the repository, and it runs no project code or
    # dependencies: it uploads what verify built and checked.
    needs: verify
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref_type == 'tag') }}
    runs-on: ${{ vars.HH_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Publish to Gitea Releases
        env:
          GITEA_API: ${{ github.server_url }}/api/v1
          GITEA_REPO: ${{ github.repository }}
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="${{ github.sha }}"
          if [ "${{ github.ref_type }}" = tag ]; then
            python3 -I release/publish_release.py --dist release/dist --notes release/notes.md \
              --tag "${{ github.ref_name }}" --commit "$sha"
          else
            build="$(basename release/dist/maestro-*.tar.gz .tar.gz)"
            python3 -I release/publish_release.py --dist release/dist --notes release/notes.md \
              --tag "dev-${sha:0:12}" --commit "$sha" --title "$build" --prerelease --keep 10
          fi
