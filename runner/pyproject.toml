[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "maestro-runner"
version = "1"
description = "Maestro Runner: executes one run as one Harbor Job and speaks the Runner protocol"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = ["harbor==0.24.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/maestro_runner"]
